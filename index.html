<title>Mes jeux d'école</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+FR+Moderne:wght@400&family=Playwrite+FR+Trad:wght@400&display=swap">
<style id="css-on">
/* Layout : une page de cahier Seyès, une carte-question au centre, gros boutons pour le pouce */
:root{
  --paper:#ffffff; --line:#d3def5; --margin:#ec8f9a; --ink:#1f2a5c; --soft:#5b6694;
  --pink:#ff9fd0; --pinkd:#d63d8f; --ok:#1f9d63; --oklt:#dcf5e8; --ko:#d64545; --kolt:#fde3e3;
  --tile:#eef2fd;
  --f-script:"Playwrite FR Moderne", "Segoe Script", cursive;
  --f-read:"Andika", "Comic Sans MS", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:var(--f-read); font-size:18px;
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--line) 31px 32px);
  min-height:100vh;
}
.wrap{max-width:560px; margin:0 auto; padding-block:20px 40px; padding-inline:16px 16px; padding-left:52px}
h1{font-family:var(--f-script); font-weight:400; font-size:1.6rem; margin:0 0 4px; line-height:1.6}
.sub{color:var(--soft); margin:0 0 18px; font-size:1rem}
.card{background:var(--paper); border:2px solid var(--ink); border-radius:14px; padding:20px 16px; box-shadow:4px 4px 0 var(--line)}
.top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:14px; font-size:.95rem; color:var(--soft)}
.bar{flex:1; height:10px; background:var(--tile); border-radius:6px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--pink); transition:width .3s}
.q{font-size:1.15rem; margin:0 0 6px; font-weight:700}
.hint{font-size:2.6rem; text-align:center; margin:6px 0 10px}
.speak{display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:1rem; background:var(--tile); color:var(--ink); border:2px solid var(--ink); border-radius:999px; padding:8px 16px; cursor:pointer}
.center{text-align:center}
.opts{display:grid; gap:10px; margin-top:14px}
.opt{font:inherit; font-size:1.5rem; padding:14px; border:2px solid var(--ink); border-radius:12px; background:var(--paper); color:var(--ink); cursor:pointer; min-height:60px}
.opt:focus-visible,.tl:focus-visible,.btn:focus-visible,.speak:focus-visible{outline:3px solid var(--pinkd); outline-offset:2px}
.opt.good{background:var(--oklt); border-color:var(--ok)}
.opt.bad{background:var(--kolt); border-color:var(--ko); text-decoration:line-through}
.gap{font-size:2rem; text-align:center; margin:10px 0; letter-spacing:.02em}
.gap b{display:inline-block; min-width:2.2em; border-bottom:3px dashed var(--pinkd); color:var(--pinkd)}
.row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:12px}
.row .opt{min-width:80px}
.slots{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0}
.slot{width:40px; height:48px; border-bottom:3px solid var(--ink); font-size:1.8rem; text-align:center; line-height:48px}
.tiles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.tl{font:inherit; font-size:1.6rem; width:48px; height:52px; border:2px solid var(--ink); border-radius:10px; background:var(--tile); color:var(--ink); cursor:pointer}
.tl:disabled{opacity:.25}
.fb{margin-top:16px; padding:12px; border-radius:10px; font-size:1.1rem; text-align:center}
.fb.ok{background:var(--oklt); color:var(--ok)}
.fb.ko{background:var(--kolt); color:var(--ko)}
.fb .w{display:block; font-size:1.8rem; color:var(--ink); margin-top:4px}
mark{background:var(--pink); color:inherit; border-radius:6px; padding:0 2px}
.btn{font:inherit; font-weight:700; font-size:1.1rem; background:var(--ink); color:var(--paper); border:0; border-radius:12px; padding:14px 22px; cursor:pointer; width:100%; margin-top:14px}
.btn.ghost{background:var(--paper); color:var(--ink); border:2px solid var(--ink)}
.stars{font-size:2.6rem; text-align:center; letter-spacing:.1em}
.list{display:grid; gap:6px; margin:10px 0 0; padding:0; list-style:none}
.list li{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:1.35rem; padding:6px 10px; border-bottom:1px solid var(--line)}
.list button{font:inherit; font-size:1rem; background:var(--tile); border:1px solid var(--ink); color:var(--ink); border-radius:999px; padding:4px 10px; cursor:pointer}
.rule{background:var(--tile); border-radius:10px; padding:12px 14px; margin-top:16px; font-size:1rem; line-height:1.5}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:420px){.wrap{padding-left:48px}.tl{width:42px;height:48px;font-size:1.4rem}.slot{width:32px}}
</style>

</style>

function say(t){

    const u=new SpeechSynthesisUtterance(SAY[t]||t);
    u.lang="fr-FR"; u.rate=.8; u.volume=1; if(frVoice) u.voice=frVoice;

const core=w=>w.split(" ").pop().replace(",","");

function build(n){
  let all=[];
  W.forEach(it=>["choix","trou","lettres"].forEach(t=>{
    if(t==="lettres" && (it.w.includes(",")||core(it.w).length>8)) return;
    all.push({it,t});
  }));
  all=shuffle(all).slice(0,n);
  for(let k=1;k<all.length;k++){
    if(all[k].it===all[k-1].it){
      const j=all.findIndex((x,m)=>m>k && x.it!==all[k-1].it && (!all[m-1]||all[m-1].it!==all[k].it));
      if(j>0)[all[k],all[j]]=[all[j],all[k]];
    }
  }
  return all;
}

function qRuler(){

function build(n){

    if(kind===3)out.push(qCmp(m[(k>>2)%m.length]));
  }

}

      app.innerHTML=head+`<div class="gslots">${[...w].map(()=>'<span class="gslot"></span>').join("")}</div><div class="gtiles">${letters.map((l,k)=>`<button class="gtl" id="l${k}" data-v="${l}">${l}</button>`).join("")}</div><button class="btn" id="del" style="background:var(--paper);color:var(--ink);border:2px solid var(--ink)">⌫ Effacer une lettre</button><div id="fb"></div>`;

      tiles.forEach(b=>b.onclick=()=>{typed.push({v:b.dataset.v,b});b.disabled=true;draw();
        if(typed.length===w.length){tiles.forEach(x=>x.disabled=true);document.getElementById("del").disabled=true;after(typed.map(x=>x.v).join("")===w);}});
      document.getElementById("del").onclick=()=>{const x=typed.pop();if(x){x.b.disabled=false;draw();}};

    }
    if(q.order){
      const sign=q.sep||(q.order[1]>q.order[0]?"&lt;":"&gt;");
      app.innerHTML=head+`<div class="seq" id="seq"><span class="ph">Touche les nombres dans l'ordre…</span></div>

      const btns=[...app.querySelectorAll(".opt")];
      btns.forEach(b=>b.onclick=()=>{

        b.disabled=true; b.classList.add(ok?"done":"bad");

        if(!ok||pos===q.order.length){ btns.forEach(x=>x.disabled=true); after(ok); }
      });
      return;
    }
    const opts=q.keep?q.opts:sh(q.opts);
    app.innerHTML=head+`<div class="opts${q.col?" col":""}">${opts.map((o,k)=>`<button class="opt" id="o${k}" data-i="${k}">${o}</button>`).join("")}</div><div id="fb"></div>`;bindSp();

      if(!ok)b.classList.add("bad");

  }
  function end(){markDone(N,score);
    const r=score/N,s=r>=.9?3:r>=.6?2:1;
    app.innerHTML=`<div class="stars">${"⭐".repeat(s)}${"☆".repeat(3-s)}</div>

    document.getElementById("again").onclick=()=>start(N);
    document.getElementById("home").onclick=lesson;
  }

function deck(arr){let d=[];return sh=>{if(!d.length)d=sh(arr);return d.pop();};}

/* ---------- G5 : Les types de phrases ---------- */
function gamePhrases(){
  const DECL=["Le garçon gonfle un ballon.","Il pleut ce matin.","Mon chat dort sur le lit.","Nous allons à la piscine.","J'aime les fraises.","La maîtresse lit une histoire.","Ce film est très drôle.","Papa prépare le repas.","Les oiseaux chantent dans l'arbre.","Ma sœur a sept ans."];
  const INTER=["Est-ce que tu as peur ?","Où est mon cartable ?","Veux-tu jouer avec moi ?","Quelle heure est-il ?","Est-ce que le chien a mangé ?","Comment t'appelles-tu ?","Pourquoi le ciel est-il bleu ?","Tu viens au parc ?","Qui a mangé le gâteau ?","As-tu fini tes devoirs ?"];
  const IMP=["Stop ! Arrêtez-vous !","Écoute bien la maîtresse.","Range ta chambre.","Ne cours pas dans le couloir !","Mets ton manteau.","Viens ici !","Lave-toi les mains.","Ne touche pas le four !","Ferme la porte, s'il te plaît.","Prends ton goûter."];
  const T={decl:"déclaratif",inter:"interrogatif",imp:"impératif"};
  const WHY={decl:"Elle dit ou raconte quelque chose. Elle finit par un point.",inter:"Elle pose une question. Elle finit par un point d'interrogation ?",imp:"Elle donne un ordre, un conseil ou une interdiction. Elle finit par . ou !"};
  const all=[...DECL.map(s=>[s,"decl"]),...INTER.map(s=>[s,"inter"]),...IMP.map(s=>[s,"imp"])];
  const dAll=deck(all), dDI=deck([...DECL.map(s=>[s,"decl"]),...INTER.map(s=>[s,"inter"])]);
  const ROLE={decl:"raconte quelque chose",inter:"pose une question",imp:"donne un ordre"};
  quizGame({
    lesson:`<p class="q">Les 3 types de phrases</p>
      <div class="ladder">
        <div class="step"><b>.</b><span><strong>Déclaratif</strong> : je dis, je raconte, je donne un avis.<br><i>Le garçon gonfle un ballon.</i></span></div>
        <div class="step"><b>?</b><span><strong>Interrogatif</strong> : je pose une question.<br><i>Est-ce que tu as peur ?</i></span></div>
        <div class="step"><b>! .</b><span><strong>Impératif</strong> : je donne un ordre, un conseil, une interdiction.<br><i>Stop ! Arrêtez-vous ! · Écoute bien la maîtresse.</i></span></div>
      </div>`,
    gens:[
      sh=>{const [s,t]=dAll(sh);return {label:"Quel est le type de cette phrase ?",body:`<div class="big">${s}</div>`,opts:Object.values(T),ans:T[t],keep:true,recap:`« ${s} » → ${T[t]}`,tip:WHY[t]};},
      sh=>{const [s,t]=dDI(sh);const cut=s.replace(/\s?[.?!]$/,"");const p=t==="decl"?".":"?";
        return {label:"Quel signe mettre à la fin ?",body:`<div class="big">${cut} <span class="blank">…</span></div>`,fill:p,opts:[".","?","!"],ans:p,keep:true,recap:`${cut} ${p}`,tip:WHY[t]};},
      sh=>{const t=sh(["decl","inter","imp"])[0];
        const pool={decl:DECL,inter:INTER,imp:IMP};
        const good=sh(pool[t])[0];
        const others=Object.keys(pool).filter(k=>k!==t).map(k=>sh(pool[k])[0]);
        return {label:`Quelle phrase ${ROLE[t]} ?`,opts:[good,...others],ans:good,col:true,recap:`« ${good} » → ${T[t]}`,tip:WHY[t]};}
    ]
  });
}

/* ---------- N8 / N9 : Ordre croissant et décroissant ---------- */
function gameOrdre(){
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const set=(n,max)=>{const s=new Set();while(s.size<n)s.add(rnd(0,max));return [...s];};
  const inv=n=>{const d=n%10,t=Math.floor(n/10);return d&&d!==t?d*10+t:null;};
  const CR="du plus petit au plus grand", DE="du plus grand au plus petit";
  quizGame({
    lesson:`<p class="q">Ranger des nombres</p>
      <div class="ladder">
        <div class="step"><b>↗</b><span><strong>Ordre croissant</strong> : je range du plus <strong>petit</strong> au plus <strong>grand</strong>.<br><i>5 &lt; 8 &lt; 10 &lt; 11 &lt; 13</i> (🐭 → 🦁 → 🦒)</span></div>
        <div class="step"><b>↘</b><span><strong>Ordre décroissant</strong> : je range du plus <strong>grand</strong> au plus <strong>petit</strong>.<br><i>19 &gt; 16 &gt; 13 &gt; 11 &gt; 10</i> (🦒 → 🦁 → 🐭)</span></div>
      </div>
      <p style="font-size:1rem;line-height:1.5;margin:12px 0 0">Astuce : je <strong>barre</strong> les nombres au fur et à mesure que je les utilise. Dans le jeu, ils se grisent tout seuls !<br>Le signe <strong>&lt;</strong> veut dire « plus petit que ». Sa pointe montre le plus petit.</p>`,
    gens:[
      sh=>{const up=Math.random()<.5, n=rnd(4,5), arr=set(n,Math.random()<.4?30:99).sort((x,y)=>x-y); if(!up)arr.reverse();
        const txt=arr.join(up?" &lt; ":" &gt; ");
        return {label:`Range dans l'ordre <strong>${up?"croissant":"décroissant"}</strong> (${up?CR:DE}) :`,order:arr,ans:txt,recap:txt,tip:up?"Croissant : je commence par le plus petit.":"Décroissant : je commence par le plus grand."};},
      sh=>{let a=rnd(1,99),b=inv(a);if(b===null||Math.random()<.5){do{b=rnd(1,99)}while(b===a)}
        const s=a<b?"<":">";
        return {label:"Quel signe ?",body:`<div class="big">${a} <span class="blank">?</span> ${b}</div>`,fill:s==="<"?"&lt;":"&gt;",opts:["<",">"],ans:s,keep:true,recap:`${a} ${s} ${b}`,tip:s==="<"?`${a} est plus petit que ${b}.`:`${a} est plus grand que ${b}.`};},
      sh=>{const k=rnd(0,2), arr=set(5,99); if(k===0)arr.sort((x,y)=>x-y); else if(k===1)arr.sort((x,y)=>y-x); else { const s2=[...arr].sort((x,y)=>x-y); if(arr.join()===s2.join()||arr.join()===[...s2].reverse().join()) [arr[0],arr[1]]=[arr[1],arr[0]]; }
        const ans=["croissant","décroissant","pas rangés"][k];
        return {label:"Ces nombres sont rangés dans l'ordre…",body:`<div class="big">${arr.join(" – ")}</div>`,opts:["croissant","décroissant","pas rangés"],ans,keep:true,recap:`${arr.join(" – ")} : ${ans}`,tip:k===0?"Ils vont du plus petit au plus grand.":k===1?"Ils vont du plus grand au plus petit.":"Ils ne vont ni toujours en montant, ni toujours en descendant."};},
      sh=>{const arr=set(5,99), big=Math.random()<.5, v=big?Math.max(...arr):Math.min(...arr);
        return {label:`Quel est le plus ${big?"grand":"petit"} nombre ?`,opts:arr.map(String),ans:String(v),recap:`Le plus ${big?"grand":"petit"} : ${v}`,tip:"Je compare d'abord les dizaines, puis les unités."};}
    ]
  });
}

      sh=>{const n=d3(sh),v=2*n;return {label:`${v} est le double de…`,opts:near(n,sh([1,-1,2,n])),ans:String(n),recap:`${v} est le double de ${n}`,tip:`${n} + ${n} = ${v}`};}

/* nombres en lettres (comme dans le cahier : traits d'union, « et » sans trait) */
const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const T={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
function enLettres(n){
  if(n<20)return U[n];
  if(n<70){const t=Math.floor(n/10),u=n%10;return u===0?T[t]:u===1?T[t]+" et un":T[t]+"-"+U[u];}
  if(n<80)return n===71?"soixante et onze":"soixante-"+U[n-60];
  if(n===80)return "quatre-vingts";
  return "quatre-vingt-"+U[n-80];
}
function fauxLettres(n){
  const f=[];
  if(n>=72&&n<=76)f.push("soixante-dix-"+U[n-70]);
  if(n===80)f.push("quatre-vingt");
  if(n>80)f.push("quatre-vingts-"+U[n-80]);
  if(n>=92&&n<=96)f.push("quatre-vingt-dix-"+U[n-90]);
  return f;

function parseW(s){const m=s.match(/^(.*?)\[(.+?)\](.*)$/);const full=m[1]+m[2]+m[3];const core=full.split(" ").pop();return {pre:m[1],g:m[2],post:m[3],full,core};}
const CLS=["un objet, une personne, un lieu…","une action","une information en plus","un mot outil"];
function clsLesson(L){return `<p class="q" style="margin-top:14px">Je range les mots</p><div class="ladder">${CLS.map((c,k)=>`<div class="step"><b>${["📦","🏃","➕","🔧"][k]}</b><span><strong>${c}</strong><br>${L.filter(x=>x[1]===k).map(x=>x[0]).join(" · ")}</span></div>`).join("")}</div>`;}
function clsGen(L){const d=deck(L);return sh=>{const [w,k]=d(sh);return {label:"Ce mot, c'est…",say:w,body:`<div class="big">${w}</div>`,opts:CLS,ans:CLS[k],keep:true,col:true,recap:`${w} : ${CLS[k]}`,tip:["On peut mettre un, une, le, la ou du devant.","On peut dire : je … ou il …","Il dit comment est quelque chose, ou où il est.","Un petit mot qui aide à faire la phrase."][k]};};}
function sonGame(cfg){return function(){
  const W=cfg.words.map(x=>typeof x==="string"?parseW(x):{...parseW(x.w),opts:x.opts});
  const ok=w=>/^[a-zàâäéèêëîïôöùûüç]{3,8}$/.test(w.core);
  const dA=deck(W),dB=deck(W),dC=deck(W.filter(ok));
  const alt=w=>uniq([w.g,...(w.opts||cfg.opts)]);
  quizGame({
    lesson:`<p class="q">Le son ${cfg.son}</p><div class="rule">${cfg.rule}</div>
      <div class="wl">${W.map(w=>`<span>${w.pre}<mark>${w.g}</mark>${w.post}</span>`).join("")}</div>${cfg.cls?clsLesson(cfg.cls):""}`,
    gens:[...(cfg.cls?[clsGen(cfg.cls)]:[]),
      sh=>{const w=dA(sh);const o=alt(w).slice(0,4);return {label:"Complète le mot :",say:w.full,body:`<div class="big">${w.pre}<span class="blank">?</span>${w.post}</div>`,fill:w.g,opts:o,ans:w.g,recap:w.full,tip:`On écrit « ${w.full} ».`};},
      sh=>{const w=dB(sh);const bad=alt(w).filter(x=>x!==w.g).map(x=>w.pre+x+w.post);return {label:"Quel mot est bien écrit ?",say:w.full,opts:mk(w.full,sh(bad),3),ans:w.full,recap:w.full,tip:`On écrit « ${w.full} ».`};},
      sh=>{const w=dC(sh);const art=w.full.slice(0,w.full.length-w.core.length).trim();return {label:"Écoute et écris le mot :",say:w.full,body:art?`<div class="big" style="color:var(--soft)">${art} …</div>`:"",tiles:w.core,ans:w.core,recap:w.full,tip:`On écrit « ${w.full} ».`};}
    ]
  });
};}

/* ================= V2 / V3 : l'alphabet ================= */
function gameAlpha(){
  const A="abcdefghijklmnopqrstuvwxyz".split(""),V="aeiouy";
  const MOTS=["abeille","papillon","lion","loup","chat","chien","lapin","souris","poule","mouton","cochon","hibou","tortue","girafe","zèbre","vache","renard","ours","dauphin","cheval","canard","lézard","koala","requin"];
  const so=a=>[...a].sort((x,y)=>x.localeCompare(y,"fr"));
  quizGame({
    lesson:`<p class="q">L'alphabet (V2, V3)</p><div class="abc">${A.map(l=>`<span class="${V.includes(l)?"v":""}">${l}</span>`).join("")}</div>
      <div class="rule">Les <strong>6 voyelles</strong> : a, e, i, o, u, y. Toutes les autres lettres sont des <strong>consonnes</strong>.<br><br>

    gens:[
      sh=>{const l=sh(A)[0];const v=V.includes(l);return {label:"Voyelle ou consonne ?",body:`<div class="big" style="font-size:3rem">${l}</div>`,opts:["voyelle","consonne"],ans:v?"voyelle":"consonne",keep:true,recap:`${l} → ${v?"voyelle":"consonne"}`,tip:"Les voyelles : a, e, i, o, u, y."};},
      sh=>{const i=R(1,24),aft=Math.random()<.6,l=A[i],ans=aft?A[i+1]:A[i-1];return {label:`Quelle lettre vient juste ${aft?"après":"avant"} « ${l} » ?`,opts:mk(ans,sh([aft?A[i-1]:A[i+1],A[Math.min(25,i+2)],A[Math.max(0,i-2)]]),3),ans,recap:`${A[i-1]} – ${l} – ${A[i+1]}`,tip:`Dans l'alphabet : ${A.slice(Math.max(0,i-2),i+3).join(" ")}`};},
      sh=>{let w;const same=Math.random()<.35;if(same){const g=sh([["lion","loup","lapin","lézard"],["chat","chien","cheval","cochon","canard"],["poule","papillon","pingouin"],["requin","renard"]])[0];w=sh(g).slice(0,3);}else w=sh(MOTS).slice(0,R(3,4));
        const o=so(w);return {label:"Range dans l'ordre alphabétique :",order:o,sep:"→",ans:o.join(" → "),recap:o.join(" → "),tip:same?"Même 1ʳᵉ lettre : je regarde la 2ᵉ lettre.":"Je regarde la 1ʳᵉ lettre de chaque mot."};},
      sh=>{const w=sh(MOTS).slice(0,3),f=so(w)[0];return {label:"Quel mot vient en premier dans le dictionnaire ?",opts:w,ans:f,recap:`${so(w).join(" → ")}`,tip:"Je compare les premières lettres."};}
    ]
  });
}

      sh=>{const n=pick(),w=enLettres(n);const c=[n+1,n-1,n>=70&&n<80?n+20:n>=90?n-20:n+10,n-10].filter(x=>x>0&&x<100);return {label:"Quel nombre est écrit ?",say:String(n),body:`<div class="big">${w}</div>`,opts:mk(n,sh(c),3),ans:String(n),recap:`${w} = ${n}`,tip:n>=70?`${w} → ${n}`:`${Math.floor(n/10)} dizaines et ${n%10} unités`};},
      sh=>{const n=R(11,69),k=R(0,2),d=Math.floor(n/10),u=n%10;

        if(k===1)return {label:`Combien d'<strong>unités</strong> dans ${n} ?`,opts:mk(u,sh([d,u+1,n]),3),ans:String(u),recap:`${n} = ${d} dizaines et ${u} unités`,tip:`Le chiffre des unités est à droite : ${u}.`};
        return {label:"Quel nombre est représenté ?",body:diz(n),opts:mk(n,sh([u*10+d,n+10,n+1]).filter(x=>x!==String(n)),3),ans:String(n),recap:`${d} dizaines et ${u} unités = ${n}`,tip:`${d} barres de 10 et ${u} points : ${n}.`};},
      sh=>{const n=R(2,98),aft=Math.random()<.5,a=aft?n+1:n-1;return {label:`Quel nombre vient juste <strong>${aft?"après":"avant"}</strong> ${n} ?`,opts:mk(a,sh([aft?n-1:n+1,aft?n+10:n-10,n]),3),ans:String(a),recap:`${n-1} – ${n} – ${n+1}`,tip:aft?"Le nombre après : +1.":"Le nombre avant : −1."};},
      sh=>{const k=R(0,3);let L,Rt,lv,rv;

  const line=(a,t,off)=>{const c=[160,95],L=230,dx=Math.cos(a),dy=Math.sin(a);return {x:Math.round(c[0]+dx*L*t-dy*off),y:Math.round(c[1]+dy*L*t+dx*off)};};
  quizGame({

function rule(ch){const [T,B]=HT[baseCh(ch)]||[1,0];
  if(B<0&&T>1)return `<b>${ch}</b> monte à <b>${T}</b> et descend à <b>${-B}</b> sous la ligne`;
  if(B<0)return `<b>${ch}</b> descend à <b>${-B}</b> sous la ligne`;
  if(T>1)return `<b>${ch}</b> monte à <b>${T}</b>`;
  return `<b>${ch}</b> est courte : elle reste dans <b>1</b> interligne`;}
function wordRule(w){const sp=[...new Set([...w].map(baseCh).filter(c=>{const h=HT[c];return h&&(h[0]>1||h[1]<0);}))];
  return sp.length?"Les lettres courtes restent dans 1 interligne. Attention : "+sp.map(rule).join(" · ")+".":"Que des lettres courtes : tout reste dans 1 interligne.";}
function verdict(r,[T,B]){const t=.5,m=[];
  if(r.top>T+t)m.push(`C'est trop haut : on s'arrête au <b>${T}</b> (${nIL(T)}).`);
  else if(r.top<T-t)m.push(T===1?"C'est trop petit : monte jusqu'à la 1ʳᵉ ligne fine.":`Pas assez haut : monte jusqu'au <b>${T}</b>.`);
  if(B===0){if(r.bot<-t)m.push("Ça descend sous la grosse ligne : pose bien sur la ligne.");else if(r.bot>t)m.push("Ça flotte : pose bien sur la grosse ligne.");}
  else{if(r.bot>B+t)m.push(`Descends plus bas : jusqu'au <b>${-B}</b> sous la ligne.`);else if(r.bot<B-t)m.push(`Ça descend trop bas : seulement jusqu'au <b>${-B}</b>.`);}
  return [!m.length,m.join("<br>")];}

        c.setLineDash([9,6]);L(tgt[0],"#1f9d63");L(tgt[1],"#1f9d63");
        if(Math.abs(r.top-tgt[0])>.5)L(r.top,"#d64545");if(Math.abs(r.bot-tgt[1])>.5)L(r.bot,"#d64545");c.setLineDash([]);};
      bd.redraw();
      if(!show.tried){if(good)score++;else missed.push({it,msg});}
      show.tried=true;
      const msgs=["Bravo !","Super !","Génial !","Parfait !"];
      document.getElementById("ok").hidden=true;
      fb.innerHTML=`<div class="fb ${good?"ok":"ko"}">${good?msgs[Math.floor(Math.random()*4)]+"<small>La hauteur est bonne : tu restes entre les lignes vertes.</small>":"Presque !<small>"+msg+"<br>Les pointillés verts montent jusqu'où il faut.</small>"}</div>
        ${good?"":`<button class="btn ghost2" id="re">↺ Réessayer</button>`}<button class="btn" id="next">${i<N-1?"Question suivante →":"Voir mon score"}</button>`;
      const re=document.getElementById("re");if(re)re.onclick=()=>document.getElementById("er").onclick();
      document.getElementById("next").onclick=()=>{show.tried=false;i++;i<N?show():end();};
    };
  }
  function end(){markDone(N,score);
    const r=score/N,s=r>=.9?3:r>=.6?2:1;
    app.innerHTML=`<div class="stars">${"⭐".repeat(s)}${"☆".repeat(3-s)}</div>
      <p class="big" style="font-size:1.3rem">${score} / ${N} bien écrits du premier coup</p>
      <p style="text-align:center">${score===N?"Champion·ne de l'écriture !":r>=.6?"Très bien ! Encore une partie ?":"On s'entraîne encore un peu !"}</p>
      ${missed.length?`<p class="q" style="margin-top:16px">À retravailler :</p><ul class="list">${missed.map(q=>`<li><b class="wtgt" style="color:#1f3fbf">${q.it}</b><br><span style="color:var(--soft)">${q.msg}</span></li>`).join("")}</ul>`:""}
      <button class="btn" id="again">Rejouer</button><button class="btn ghost2" id="home">Revoir la leçon</button>`;
    document.getElementById("again").onclick=()=>start(N);
    document.getElementById("home").onclick=lesson;
  }
  function lesson(){
    app.innerHTML=cfg.lesson+`<p class="q" style="margin-top:18px">On écrit ! Combien de questions ?</p>
      <div class="opts"><button class="opt" id="n10" data-n="10">10</button><button class="opt" id="n20" data-n="20">20</button><button class="opt" id="n30" data-n="30">30</button></div>`;
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>start(+b.dataset.n));

function gamePluriel(){
  const PL=[["un tuyau","tuyaux","eau",0],["un chapeau","chapeaux","eau",0],["un cheveu","cheveux","eau",0],["un bateau","bateaux","eau",0],["un gâteau","gâteaux","eau",0],["un oiseau","oiseaux","eau",0],["un cadeau","cadeaux","eau",0],["un jeu","jeux","eau",0],["un feu","feux","eau",0],["un château","châteaux","eau",0],
    ["un landau","landaus","eau",1],["un pneu","pneus","eau",1],["un bleu","bleus","eau",1],
    ["un clou","clous","ou",0],["un trou","trous","ou",0],["un cou","cous","ou",0],["un bisou","bisous","ou",0],["un kangourou","kangourous","ou",0],["un fou","fous","ou",0],
    ["un bijou","bijoux","ou",1],["un hibou","hiboux","ou",1],["un caillou","cailloux","ou",1],["un chou","choux","ou",1],["un genou","genoux","ou",1],["un pou","poux","ou",1],["un joujou","joujoux","ou",1],
    ["un cheval","chevaux","al",0],["un journal","journaux","al",0],["un animal","animaux","al",0],["un hôpital","hôpitaux","al",0],["un bocal","bocaux","al",0],["un signal","signaux","al",0],
    ["un bal","bals","al",1],["un festival","festivals","al",1],["un carnaval","carnavals","al",1],["un chacal","chacals","al",1],["un régal","régals","al",1]];
  const GEN=[["un chat","chats"],["une table","tables"],["une fleur","fleurs"],["un ami","amis"],["une maison","maisons"],["un crayon","crayons"]];
  const FAM={eau:"-au, -eau, -eu",ou:"-ou",al:"-al"};
  const SAUF={eau:"des landaus, des pneus, des bleus",ou:"bijoux, cailloux, choux, genoux, hiboux, joujoux, poux",al:"des bals, festivals, carnavals, chacals, régals"};
  const sg=e=>e[0].split(" ").pop();
  const tip=e=>{const [s1,p1,f,x]=e;if(!f)return "En règle générale, on ajoute un -s.";
    if(x)return `« ${sg(e)} » est un SAUF des mots en ${FAM[f]} : ${SAUF[f]}.`;

  const ALL=[...PL,...GEN.map(g=>[g[0],g[1],"",0])];

    ["Les mots en -au, -eau, -eu prennent au pluriel…",["un -x","un -s","-aux"],"un chapeau → des chapeaux (sauf landaus, pneus, bleus)."],
    ["Les mots en -ou prennent au pluriel…",["un -s","un -x","-aux"],"un clou → des clous… sauf les 7 en -x !"],
    ["Les mots en -al font leur pluriel en…",["-aux","-als","-alx"],"un cheval → des chevaux (sauf bals, festivals, carnavals, chacals, régals)."],
    ["Combien de mots en -ou prennent un -x ?",["7","3","5"],"bijou, caillou, chou, genou, hibou, joujou, pou."],
    ["Quels mots en -eu prennent un -s ?",["pneu et bleu","jeu et feu","cheveu et jeu"],"des pneus, des bleus (et des landaus)."]];
  quizGame({
    lesson:`<p class="q">Le pluriel des mots (O5)</p>
      <div class="rule">En règle générale, on ajoute un <strong>-s</strong> au pluriel : un chat → des chat<mark>s</mark>. Mais…</div>
      <div class="ladder">
        <div class="step"><b>-au -eau -eu</b><span>prennent un <strong>-x</strong> : des tuyau<mark>x</mark>, des chapeau<mark>x</mark>, des cheveu<mark>x</mark>.<br><strong>SAUF</strong> : des landau<mark>s</mark>, des pneu<mark>s</mark>, des bleu<mark>s</mark>.</span></div>
        <div class="step"><b>-ou</b><span>prennent un <strong>-s</strong> : des clou<mark>s</mark>, des trou<mark>s</mark>.<br><strong>SAUF</strong> ces 7 mots en -x : bijou<mark>x</mark>, caillou<mark>x</mark>, chou<mark>x</mark>, genou<mark>x</mark>, hibou<mark>x</mark>, joujou<mark>x</mark>, pou<mark>x</mark>.</span></div>

    gens:[

        return {label:`Quel est le pluriel de « ${e[0]} » ?`,say:"des "+e[1],opts:mk("des "+e[1],sh(c.map(x=>"des "+x)),3),ans:"des "+e[1],recap:`${e[0]} → des ${e[1]}`,tip:tip(e)};},
      sh=>{const e=d2(sh),w=sg(e),al=e[2]==="al",base=al?w.slice(0,-2):w,end=e[1].slice(base.length);
        return {label:"Complète la fin du mot :",body:`<div class="big">${e[0]} → des ${base}<span class="blank">?</span></div>`,fill:end,opts:al?["aux","als"]:["s","x"],ans:end,keep:true,recap:`${e[0]} → des ${e[1]}`,tip:tip(e)};},
      sh=>{const f=sh(["eau","ou","al"])[0],ex=sh(PL.filter(e=>e[2]===f&&e[3]))[0],rg=sh(PL.filter(e=>e[2]===f&&!e[3])).slice(0,2);
        return {label:`Mots en ${FAM[f]} : lequel est un <strong>SAUF</strong> ?`,opts:[ex,...rg].map(e=>"des "+e[1]),ans:"des "+ex[1],recap:`des ${ex[1]} : c'est un SAUF`,tip:`Les SAUF des mots en ${FAM[f]} : ${SAUF[f]}.`};},
      sh=>{const e=d4(sh);return {label:"Écoute et écris le pluriel :",say:"des "+e[1],body:`<div class="big" style="color:var(--soft)">${e[0]} → des …</div>`,tiles:e[1],ans:e[1],recap:`${e[0]} → des ${e[1]}`,tip:tip(e)};},
      factGen(F)
    ]
  });
}

function gamePyramide(){

    lesson:`<p class="q">La pyramide mathématique</p><div class="rule">Chaque case contient la <strong>somme des deux cases en dessous</strong>.<br>Si 3 et 5 sont en bas, la case au-dessus vaut 3 + 5 = <strong>8</strong>.<br>Si je connais le haut et une case du bas, j'enlève : 8 − 3 = 5.</div>`,
    gens:[sh=>{const n=Math.random()<.5?3:4,b=[];for(let k=0;k<n;k++)b.push(R(0,9));const rows=[b];while(rows[rows.length-1].length>1){const l=rows[rows.length-1];rows.push(l.slice(1).map((v,k)=>l[k]+v));}

      else{const r=R(1,rows.length-1),c=R(0,rows[r].length-1);hid=[r,c];ans=rows[r][c];tip=`${rows[r-1][c]} + ${rows[r-1][c+1]} = ${ans}`;}
      return {label:"Quel nombre va dans la case « ? » ?",body:pyr(rows,hid),opts:mk(ans,sh(near(ans,[1,-1,2,10,-2]).filter(x=>x>=0)),4),ans:String(ans),recap:tip,tip};}]

      sh=>{const d=R(2,9),u=R(0,9),l=d*10+u,k=R(0,2),rv=k===0?l:k===1?l+R(1,5):l-R(1,5),s=l<rv?"<":l>rv?">":"=";return {label:"Quel signe ?",body:`<div class="big">${d}d ${u}u <span class="blank">?</span> ${rv}u</div>`,fill:s==="<"?"&lt;":s===">"?"&gt;":"=",opts:["<",">","="],ans:s,keep:true,recap:`${d}d ${u}u = ${l}, donc ${l} ${s} ${rv}`,tip:`${d}d ${u}u = ${l}.`};}
    ].map(g=>sh=>{let q;do{q=g(sh)}while(!q);return q;})

const DICT={

  pieges:["À gauche des blousons, il y a les chapeaux.","Les chevaux marchent sur le chemin.","Mes cadeaux sont sur la table.","Le hibou et les hiboux dorment dans l'arbre.","Chaque jour, je vais chez mamie parce que je l'aime beaucoup.","Demain, nous irons au marché avec papa.","Est-ce que tu as un chapeau ?","Les journaux sont toujours sur la table.","Hier, les enfants ont chanté une chanson.","Pourquoi les chats sont-ils méchants ?","Aujourd'hui, les garçons jouent dehors.","Mes amis ont des dents blanches."]
};
const CKEY="mes-jeux-carnet";
function getCarnet(){try{return JSON.parse(localStorage.getItem(CKEY)||"{}")}catch(e){return {}}}
function setCarnet(c){try{localStorage.setItem(CKEY,JSON.stringify(c))}catch(e){}}
const noAcc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const normQ=s=>s.replace(/[’`]/g,"'");
function toks(s){return normQ(s).replace(/([,.?!])/g," $1 ").split(/\s+/).filter(Boolean);}
function sayChunks(chunks){
  if(!("speechSynthesis" in window))return;
  try{if(!FRV)pickFR();speechSynthesis.cancel();
    setTimeout(()=>{chunks.forEach(c=>{const u=new SpeechSynthesisUtterance(c);u.lang="fr-FR";u.rate=.65;if(FRV)u.voice=FRV;speechSynthesis.speak(u);});},120);}catch(e){}
}
function slowChunks(s){
  const parts=normQ(s).replace(/[.?!]$/,"").split(/,\s*/);const out=[];
  parts.forEach(p=>{const w=p.split(" ");for(let k=0;k<w.length;k+=3)out.push(w.slice(k,k+3).join(" "));});
  return out;
}
/* aligne les mots tapés sur les mots attendus (distance d'édition) */
function alignWords(tgt,got){
  const n=tgt.length,m=got.length,eq=(a,b)=>a.toLowerCase()===b.toLowerCase(),near=(a,b)=>noAcc(a.toLowerCase())===noAcc(b.toLowerCase());
  const D=[...Array(n+1)].map(()=>Array(m+1).fill(0));
  for(let i=0;i<=n;i++)D[i][0]=i;for(let j=0;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){const c=eq(tgt[i-1],got[j-1])?0:near(tgt[i-1],got[j-1])?.4:.9;D[i][j]=Math.min(D[i-1][j-1]+c,D[i-1][j]+1,D[i][j-1]+1);}
  const res=Array(n).fill(null);let i=n,j=m;
  while(i>0&&j>0){const c=eq(tgt[i-1],got[j-1])?0:near(tgt[i-1],got[j-1])?.4:.9;
    if(Math.abs(D[i][j]-(D[i-1][j-1]+c))<1e-9){res[i-1]=got[j-1];i--;j--;}
    else if(Math.abs(D[i][j]-(D[i-1][j]+1))<1e-9){i--;}else{j--;}}
  return res;
}
function why(t,g){
  if(!g)return "Mot oublié.";
  const tl=t.toLowerCase(),gl=g.toLowerCase();
  if(noAcc(tl)===noAcc(gl))return `Presque ! Attention à l'accent : <b>${t}</b>.`;
  if(/[sx]$/.test(tl)&&tl.slice(0,-1)===gl)return `Plusieurs → <b>${tl.slice(-1)}</b> à la fin : <b>${t}</b>.`;
  if(/aux$/.test(tl)&&gl===tl.replace(/aux$/,"al"))return `Plusieurs : un cheval → des chevaux, un journal → des journaux.`;
  if(gl.replace(/(.)\1/g,"$1")===tl.replace(/(.)\1/g,"$1"))return `Attention aux lettres doubles : <b>${t}</b>.`;
  return `On écrit <b>${t}</b>.`;
}
function gameDictee(){
  const app=document.getElementById("app");
  const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a};
  let lv=1,items=[],i=0,okW=0,totW=0,txt="",shift=true,done=false;
  function pick(level){
    const car=Object.keys(getCarnet());
    if(level===1){const fromC=sh(car.filter(w=>!w.includes(" ")||DICT.mots.includes(w))).slice(0,4);return sh([...fromC,...sh(DICT.mots.filter(w=>!fromC.includes(w)))].slice(0,8));}
    const pool=level===2?DICT.simples:DICT.pieges;
    const withC=sh(pool.filter(p=>toks(p).some(w=>car.includes(w.toLowerCase()))));
    return [...new Set([...withC,...sh(pool)])].slice(0,3);
  }
  function lesson(){
    const c=getCarnet(),ws=Object.keys(c);
    app.innerHTML=`<p class="q">La dictée du soir</p>
      <div class="rule">J'écoute, j'écris avec le clavier, je vérifie.<br>Une phrase commence par une <strong>majuscule</strong> et finit par un <strong>point</strong>.<br>Les mots que je rate vont dans mon <strong>carnet</strong> : ils reviennent jusqu'à ce que je les réussisse 3 fois.</div>
      <p class="q" style="margin-top:16px">Mon carnet de mots difficiles ${ws.length?`(${ws.length})`:""}</p>
      ${ws.length?`<div class="carnet">${ws.map(w=>`<span>${w} <i>${"●".repeat(c[w])}${"○".repeat(3-c[w])}</i></span>`).join("")}</div>`:`<p class="note" style="color:var(--soft)">Vide pour l'instant. Bravo !</p>`}
      <p class="q" style="margin-top:16px">Choisis ta dictée :</p>
      <div class="dlv"><button class="btn" data-lv="1">1 · Les mots (8 mots)</button><button class="btn" data-lv="2">2 · Les phrases (3 phrases)</button><button class="btn" data-lv="3">3 · Les phrases pièges (3 phrases)</button></div>`;
    app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{lv=+b.dataset.lv;items=pick(lv);i=0;okW=0;totW=0;show();});
  }
  const ROWS=[["a","z","e","r","t","y","u","i","o","p"],["q","s","d","f","g","h","j","k","l","m"],["⇧","w","x","c","v","b","n","'","-","⌫"],["é","è","ê","à","ç","ù","â","î","ô","ë"],[",",".","?","!","␣"]];
  function kb(){return `<div class="kb">${ROWS.map((r,ri)=>`<div class="kr${ri===4?" last":""}">${r.map(k=>`<button class="key${k==="⇧"&&shift?" on":""}${k==="␣"?" sp":""}" data-k="${k}">${k==="␣"?"espace":k==="⇧"?"⇧ Maj":/^[a-zéèêàçùâîôë]$/.test(k)&&shift?k.toUpperCase():k}</button>`).join("")}</div>`).join("")}</div>`;}
  function show(){
    const it=items[i];txt="";shift=lv>1;done=false;
    app.innerHTML=`<div class="top"><span>${lv===1?"Mot":"Phrase"} ${i+1}/${items.length}</span><span class="bar"><i style="width:${i/items.length*100}%"></i></span><span>✓ ${okW}</span></div>
      <div class="drow"><button class="btn" id="d-ec">🔊 Écouter</button>${lv>1?`<button class="btn ghostd" id="d-sl">🐢 Lentement</button>`:""}</div>
      <div class="dbox" id="d-box" aria-live="polite"></div>
      <div id="d-kb">${kb()}</div>
      <div id="fb"></div><button class="btn" id="d-ok" style="width:100%;margin-top:10px">✓ J'ai fini</button>`;
    const box=document.getElementById("d-box");
    const paint=()=>{box.innerHTML=(txt?txt.replace(/&/g,"&amp;").replace(/</g,"&lt;"):`<span class="ph">Écoute, puis écris ici…</span>`)+`<span class="caret"></span>`;};
    paint();
    const bindKb=()=>document.querySelectorAll("#d-kb .key").forEach(b=>b.onclick=()=>{
      if(done)return;const k=b.dataset.k;
      if(k==="⌫")txt=txt.slice(0,-1);else if(k==="⇧"){shift=!shift;document.getElementById("d-kb").innerHTML=kb();bindKb();return;}
      else if(k==="␣")txt+=" ";else{const ch=shift&&/^[a-zéèêàçùâîôë]$/.test(k)?k.toUpperCase():k;txt+=ch;if(shift){shift=false;document.getElementById("d-kb").innerHTML=kb();bindKb();}}
      paint();});
    bindKb();
    document.getElementById("d-ec").onclick=()=>sayFr(it);
    const sl=document.getElementById("d-sl");if(sl)sl.onclick=()=>sayChunks(slowChunks(it));
    setTimeout(()=>sayFr(it),300);
    document.getElementById("d-ok").onclick=()=>{
      if(!txt.trim()){document.getElementById("fb").innerHTML=`<div class="fb ko">Écris d'abord ${lv===1?"le mot":"la phrase"} !</div>`;return;}
      done=true;check(it);};
  }
  function check(it){
    const T=toks(it),G=toks(txt.trim());
    const W=T.filter(w=>!/^[,.?!]$/.test(w)),Gw=G.filter(w=>!/^[,.?!]$/.test(w));
    const al=alignWords(W,Gw);const c=getCarnet();const msgs=[];let allOk=true;
    const html=W.map((w,k)=>{const g=al[k],ok=!!g&&g.toLowerCase()===w.toLowerCase();const key=w.toLowerCase();totW++;
      if(ok){okW++;if(c[key]!=null){c[key]++;if(c[key]>=3)delete c[key];}return `<span class="dw ok">${g}</span>`;}
      allOk=false;if(g&&key.length>2)c[key]=0;msgs.push(why(w,g));
      return `<span class="dw ko"><s>${g||"…"}</s><b>${w}</b></span>`;}).join(" ");
    setCarnet(c);
    if(lv>1){const gt=txt.trim();
      if(gt&&gt[0]!==gt[0].toUpperCase()){msgs.push("N'oublie pas la <b>majuscule</b> au début de la phrase.");allOk=false;}
      const p=it.trim().slice(-1);if(!gt.endsWith(p)){msgs.push(`N'oublie pas le <b>${p}</b> à la fin.`);allOk=false;}}
    document.getElementById("d-kb").innerHTML="";document.getElementById("d-ok").remove();
    document.getElementById("d-box").innerHTML=html;
    const praise=["Bravo !","Super !","Parfait !","Génial !"][Math.floor(Math.random()*4)];

      <p class="note" style="text-align:center;margin:8px 0 0">La bonne écriture : <b>${it}</b></p>
      <button class="btn" id="next" style="width:100%;margin-top:10px">${i<items.length-1?"Suivant →":"Voir mon score"}</button>`;
    document.getElementById("next").onclick=()=>{i++;i<items.length?show():end();};
  }
  function end(){
    const r=totW?okW/totW:0,s=r>=.9?3:r>=.7?2:1;

      <p class="big" style="font-size:1.3rem">${okW} mots justes sur ${totW}</p>
      <p style="text-align:center">${r>=.9?"Champion·ne de la dictée !":r>=.7?"Très bien ! Les mots ratés vont dans ton carnet.":"On s'entraîne encore : ton carnet t'aidera."}</p>

      <button class="btn" id="again" style="width:100%">Une autre dictée</button>`;
    document.getElementById("again").onclick=lesson;
  }
  lesson();
}

 {id:"geo",cat:"geo",ic:"📐",bg:"#d6f1f5",t:"Tracer et aligner",d:"Tracer à la règle, points alignés · EG1, EG3",sub:"La règle et les points alignés",run:gameGeo,css:"mes",accent:"#4cb8c9"},
 {id:"semaine",cat:"temps",ic:"📆",bg:"#ffeccc",t:"La semaine",d:"Les 7 jours · veille, lendemain, hier, demain",sub:"Hier, aujourd'hui, demain… et le weekend",run:gameSemaine,css:"mes",accent:"#f2a541"},
 {id:"mois",cat:"temps",ic:"🗓️",bg:"#ffeccc",t:"Les mois",d:"Les 12 mois · numéros · 30 ou 31 jours",sub:"De janvier à décembre, et le truc du poing",run:gameMois,css:"mes",accent:"#f2a541"},
 {id:"mes",cat:"gm",ic:"📏",bg:"#fcebb0",t:"Le Défi des mesures",d:"cm, m, km · mesurer avec la règle · GM",sub:"cm · m · km — choisis, compare, mesure !",run:gameMes}
];
const CATS=[
 {sub:"Français",items:[["sons","Les sons","🔊","#ffe3ef","Mots de la semaine"],["orth","Orthographe","✍️","#ffe9d6","O"],["gram","Grammaire","📝","#d7e6ff","G"],["conj","Conjugaison","⏳","#e6f0d4","C"],["voc","Vocabulaire","🔤","#d9f3e3","V"],["ecri","Écriture","🖊️","#e9e3ff","Seyès"]]},
 {sub:"Mathématiques",items:[["num","Nombres","🔢","#efe2ff","N"],["cal","Calcul","➕","#e3f7c8","Cal"],["geo","Géométrie","📐","#d6f1f5","EG"],["gm","Mesures","📏","#fcebb0","GM"],["exo","Exercices et problèmes","🧙","#fde2d2","Entraînement"]]},
 {sub:"Questionner le monde",items:[["temps","Le temps","⏰","#ffeccc","Semaine, mois"]]}
];
const CATMAP={};CATS.forEach(c=>c.items.forEach(([k,lab,ic,bg,code])=>CATMAP[k]={lab,ic,bg,code}));
const slot=document.getElementById("stage"),ttl=document.getElementById("ttl"),sub=document.getElementById("sub"),back=document.getElementById("back");
let where={view:"home"},CUR=null;
const PKEY="mes-jeux-progress";
function getP(){try{return JSON.parse(localStorage.getItem(PKEY)||"{}")}catch(e){return {}}}
function need(n){return n>=30?24:Math.ceil(n*0.7);}
function markDone(n,sc){if(!CUR)return;const ok=sc>=need(n);
  if(ok){const p=getP();p[CUR]=Math.max(p[CUR]||0,n);try{localStorage.setItem(PKEY,JSON.stringify(p))}catch(e){}}
  setTimeout(()=>{const a=document.getElementById("app");if(!a)return;const d=document.createElement("div");d.className="valid "+(ok?"yes":"no");
    d.textContent=ok?(n>=30?"⭐ Leçon complétée !":"✓ Leçon validée en "+n+" questions !"):"Pour valider la leçon, il faut au moins "+need(n)+" / "+n+". Tu peux réessayer !";
    a.insertBefore(d,a.querySelector(".btn"));},0);}
function badge(id){const v=getP()[id]||0;return v>=30?["done","⭐ Leçon complétée"]:v>=10?["green","✓ Faite en "+v+" questions"]:["",""];}
function setHash(x){try{history.replaceState(null,"",x?location.pathname+location.search+"#"+x:location.pathname+location.search)}catch(e){}}
function menu(){
  try{speechSynthesis.cancel()}catch(e){}
  where={view:"home"};
  useCss("on"); ttl.textContent="Mes jeux d'école"; sub.textContent="Choisis une matière !"; back.hidden=true;
  slot.innerHTML=CATS.map(c=>`<section class="subj"><h2>${c.sub}</h2><div class="cats">${c.items.map(([k,lab,ic,bg,code])=>{const gs=GAMES.filter(g=>g.cat===k),n=gs.length,P=getP(),dn=gs.filter(g=>(P[g.id]||0)>=30).length,gr=gs.filter(g=>(P[g.id]||0)>=10).length;return `<button class="cat${dn===n?" alldone":""}" id="c-${k}" data-c="${k}" style="--cbg:${bg}"><span class="cic">${ic}</span><b>${lab}</b><span>${n} jeu${n>1?"x":""} · ${code}</span><span class="${gr?"prog":""}">${dn===n?"⭐ Tout est complété !":gr?`✓ ${gr}/${n} faites · ⭐ ${dn}`:"À découvrir"}</span></button>`;}).join("")}</div></section>`).join("");
  slot.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>cat(b.dataset.c));
  setHash("");
}
function cat(k){
  try{speechSynthesis.cancel()}catch(e){}
  const c=CATMAP[k]; if(!c) return menu();
  where={view:"cat",k};
  useCss("on"); ttl.textContent=c.ic+" "+c.lab; sub.textContent="Choisis une leçon !"; back.hidden=false; back.textContent="← Toutes les matières";
  const card=g=>{const [c,t]=badge(g.id);return `<button class="game ${c}" id="g-${g.id}" data-g="${g.id}"><span class="ic" style="background:${g.bg}">${g.ic}</span><span><b>${g.t}</b><span>${g.d}</span>${t?`<em class="bdg">${t}</em>`:""}</span></button>`;};
  slot.innerHTML=`<div class="menu">${GAMES.filter(g=>g.cat===k).map(card).join("")}</div>`;
  slot.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>open(b.dataset.g));
  setHash(k);
}
function open(id){
  const g=GAMES.find(x=>x.id===id); if(!g) return menu();
  where={view:"game",k:g.cat};CUR=id;
  useCss(g.css||id); ttl.textContent=g.t; sub.textContent=g.sub; back.hidden=false; back.textContent="← "+(CATMAP[g.cat]?CATMAP[g.cat].lab:"Menu");
  slot.innerHTML=`<div class="card" id="app"${g.accent?` style="--tape:${g.accent}"`:""}></div>`;
  g.run();
  setHash(id);
}
back.onclick=()=>{where.view==="game"?cat(where.k):menu();};
const h=(location.hash||"").slice(1);
GAMES.some(g=>g.id===h)?open(h):CATMAP[h]?cat(h):menu();
</script>
